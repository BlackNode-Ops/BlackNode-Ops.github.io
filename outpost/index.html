<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020304" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Outpost" />
  <title>Outpost</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <img src="icon.svg" alt="" width="36" height="36" />
        <div>
          <strong>Outpost</strong>
          <em>pushes HUBPLACE · not HUBPLACE</em>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="countdown" id="countdown"></div>
      <div class="rail-foot">
        <code>OPSBLACKNODE</code>
        <span>Studio · you tap Post</span>
      </div>
    </aside>
    <main>
      <header class="top">
        <div>
          <h1 id="viewTitle">Today</h1>
          <p id="viewSub">Ship one sliver. Leave the map in the dark.</p>
        </div>
        <div class="top-actions">
          <button type="button" id="exportBtn" class="ghost">Export</button>
          <button type="button" id="newBtn" class="primary">New sliver</button>
        </div>
      </header>
      <div id="views"></div>
    </main>
  </div>
  <div id="modal" class="modal hidden">
    <form id="form" class="sheet">
      <h2 id="formTitle">New sliver</h2>
      <label>Kind
        <select name="kind">
          <option value="TEASER">TEASER · image + one breath</option>
          <option value="SCHEDULE">SCHEDULE · queue in X</option>
          <option value="DRAFT">DRAFT · you hit Post</option>
          <option value="REPLY">REPLY · under a thread</option>
        </select>
      </label>
      <label>When<input name="when" placeholder="Now / Fri 7:30 AM PDT" /></label>
      <label>Target<input name="target" placeholder="What this is for" /></label>
      <label>Attach<input name="media" placeholder="Tight HUD crop. No wide blockout." /></label>
      <label>Copy<textarea name="body" rows="8" required></textarea></label>
      <div class="form-meta"><span id="charCount">0</span><span id="banWarn"></span></div>
      <div class="sheet-actions">
        <button type="button" id="cancelBtn" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
